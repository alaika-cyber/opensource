name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
      JWT_SECRET: "ci-test-secret-key-at-least-32-chars-long"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opensource
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Prisma DB Push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
          DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
        run: npx prisma db push

      - name: Run Automated Tests (Unit, Integration, E2E)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
          DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
          JWT_SECRET: "ci-test-secret-key-at-least-32-chars-long"
        run: npm test

      - name: Build Next.js Production Bundle
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
          DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/opensource?schema=public"
          JWT_SECRET: "ci-test-secret-key-at-least-32-chars-long"
        run: npm run build
